; US Market Desk Gauge — ESP32-2432S028R (Cheap Yellow Display)

[env:cyd]
platform = espressif32@6.9.0          ; Arduino core 2.0.17 (TFT_eSPI ยังไม่รองรับ core 3.x เต็มที่)
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv ; 3MB app (LVGL + TLS + ฟอนต์)

lib_deps =
  lvgl/lvgl@9.2.2
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  bblanchon/ArduinoJson@^7.2.0

build_flags =
  -Os
  -I include
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE   ; ฟอนต์จาก lv_font_conv ใช้ #include "lvgl.h"
  ; ---- TFT_eSPI (CYD) : ตั้งค่าที่นี่ ไม่แก้ User_Setup.h ใน library ----
  -D USER_SETUP_LOADED=1
  ; บอร์ดนี้เป็นล็อต USB 2 ช่อง (ST7789) — ILI9341_2_DRIVER ใช้ได้แต่สีซีด/เพี้ยน
  -D ST7789_DRIVER=1
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D USE_HSPI_PORT=1           ; จอใช้ HSPI, ทัชใช้ VSPI
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
